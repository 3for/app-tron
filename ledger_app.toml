[app]
build_directory = "./"
sdk = "C"
devices = ["nanox", "nanos+", "stax", "flex", "apex_p"]

[use_cases] # Coherent build options that make sense for your application
use_test_keys = "CAL_TEST_KEY=1 TRUSTED_NAME_TEST_KEY=1"
dbg_use_test_keys = "DEBUG=1 CAL_TEST_KEY=1 TRUSTED_NAME_TEST_KEY=1"
dbg_no_checks = "DEBUG=1 BYPASS_SIGNATURES=1 CHALLENGE_NO_CHECK=1"
mldsa_poc = "MLDSA_POC=1"

[tests]
unit_directory = "./tests/unit"
pytest_directory = "./tests/ragger"
